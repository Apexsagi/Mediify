services:
  mediify:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LINGSANTE_API_URL=${LINGSANTE_API_URL:-}
      - LINGSANTE_API_KEY=${LINGSANTE_API_KEY:-}
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN:-}
      - OPENAI_COMPATIBLE_API_URL=${OPENAI_COMPATIBLE_API_URL:-}
      - OPENAI_COMPATIBLE_API_KEY=${OPENAI_COMPATIBLE_API_KEY:-}
      - CLEARINGHOUSE_API_URL=${CLEARINGHOUSE_API_URL:-}
      - CLEARINGHOUSE_CLIENT_ID=${CLEARINGHOUSE_CLIENT_ID:-}
      - CLEARINGHOUSE_CLIENT_SECRET=${CLEARINGHOUSE_CLIENT_SECRET:-}
      - EPIC_FHIR_CLIENT_ID=${EPIC_FHIR_CLIENT_ID:-}
      - CERNER_FHIR_CLIENT_ID=${CERNER_FHIR_CLIENT_ID:-}
      - ATHENA_CLIENT_ID=${ATHENA_CLIENT_ID:-}
      - ATHENA_CLIENT_SECRET=${ATHENA_CLIENT_SECRET:-}
    restart: unless-stopped
